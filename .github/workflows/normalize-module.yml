name: normalize-module
on:
  push:
    branches: ["master"]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Rename module imports
        run: |
          set -euo pipefail
          find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0 sed -i 's#github.com/faizahmd2/diagnos#github.com/faizahmd2/vm-native-diagnos#g'
          sed -i 's#^module github.com/faizahmd2/diagnos$#module github.com/faizahmd2/vm-native-diagnos#' go.mod
          gofmt -w $(find . -type f -name '*.go' -not -path './.git/*')
      - name: Commit normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rename native diagnos module"
          git fetch origin master && git push --force-with-lease=master origin HEAD:master
