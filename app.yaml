# pinproc managed configuration template.
# Installed systems keep active configuration in /etc/pinproc/config.yaml.
# Change it with sudo pinproc setup ..., not by editing files.

version: 1

app:
  name: pinproc
  log_level: info

server:
  listen: 127.0.0.1:8080
  api_key: ""

ai:
  provider: ""
  config: {}

narrator:
  enabled: true

source:
  read_timeout: 2s

report:
  max_findings: 5

callback:
  enabled: false
  url: ""
  timeout: 5s