name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Package
        env:
          VERSION: 0.0.0
          GOARCH: amd64
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath -o "dist/pinproc_linux_$GOARCH" ./cmd/diagnos
          NFPM_BINARY="$PWD/dist/pinproc_linux_$GOARCH" VERSION="$VERSION" GOARCH="$GOARCH" "$(go env GOPATH)/bin/nfpm" pkg --config packaging/nfpm.yaml --packager deb --target "dist/pinproc_\${VERSION}_\${GOARCH}.deb"
          dpkg-deb --info "dist/pinproc_\${VERSION}_\${GOARCH}.deb"
          contents="$(dpkg-deb --contents "dist/pinproc_\${VERSION}_\${GOARCH}.deb")"
          printf '%s\n' "$contents"
          printf '%s\n' "$contents" | grep -F "usr/bin/pinproc"
          printf '%s\n' "$contents" | grep -F "usr/lib/systemd/system/pinproc.service"
          printf '%s\n' "$contents" | grep -F "usr/lib/sysusers.d/pinproc.conf"
          printf '%s\n' "$contents" | grep -F "etc/pinproc/config.yaml"
