name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Build provider
        run: make build-provider

      - name: Build Debian package
        run: |
          make package-deb GOARCH=amd64 VERSION=0.0.0
          dpkg-deb --info dist/pinproc_0.0.0_linux_amd64.deb