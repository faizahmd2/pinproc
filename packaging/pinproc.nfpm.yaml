name: pinproc
arch: ${PACKAGE_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
maintainer: "pinproc contributors"
description: "Read-only Linux machine investigation service"
homepage: "https://github.com/faizahmd2/pinproc"
license: "Apache-2.0"
section: utils
priority: optional
umask: 0o022

contents:
  - src: dist/pinproc_linux_${PACKAGE_ARCH}
    dst: /usr/bin/pinproc
    expand: true
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: packaging/pinproc.service
    dst: /usr/lib/systemd/system/pinproc.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: app.yaml
    dst: /usr/share/pinproc/default-config.yaml
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

deb:
  compression: zstd
