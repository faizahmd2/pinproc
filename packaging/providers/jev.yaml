protocol_version: 1
id: jev
name: JEV
description: "JEV provider adapter for pinproc"
executable: /usr/libexec/pinproc/providers/jev
settings:
  - name: api_key
    label: "JEV API key"
    type: secret
    required: true
  - name: base_url
    label: "JEV base URL"
    type: url
    required: false
    default: "https://api.typesafe.ai"
  - name: model
    label: "JEV model"
    type: string
    required: false
    default: "jev-latest"
  - name: timeout
    label: "Provider timeout"
    type: string
    required: false
    default: "10s"
