name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Build provider
        run: make build-provider

      - name: Build release artifacts
        run: make release VERSION=0.0.0

      - name: Build Debian packages
        run: |
          make package-deb GOARCH=amd64 VERSION=0.0.0
          make package-provider-jev GOARCH=amd64 VERSION=0.0.0
          ls -lh dist/*.deb

      - name: Smoke install and purge
        run: |
          CORE=dist/pinproc_0.0.0_amd64.deb
          PROVIDER=dist/pinproc-provider-jev_0.0.0_amd64.deb
          sudo apt install -y "$CORE" "$PROVIDER"
          test -x /usr/bin/pinproc
          test -x /usr/libexec/pinproc/providers/jev
          test -f /etc/pinproc/config.yaml
          test -d /var/lib/pinproc
          getent passwd pinproc
          getent group pinproc
          sudo apt remove -y pinproc-provider-jev
          test -x /usr/bin/pinproc
          sudo apt remove -y pinproc
          test -f /etc/pinproc/config.yaml
          test -d /var/lib/pinproc
          sudo apt install -y "$CORE"
          sudo apt purge -y pinproc
          test ! -e /usr/bin/pinproc
          test ! -e /etc/pinproc
          test ! -e /var/lib/pinproc
          ! getent passwd pinproc
          ! getent group pinproc