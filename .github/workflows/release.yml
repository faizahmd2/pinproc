name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Building ${GITHUB_REF_NAME} from ${GITHUB_SHA}"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build binaries
        run: make release VERSION=${GITHUB_REF_NAME#v}

      - name: Package amd64
        run: |
          make package-deb GOARCH=amd64 VERSION=${GITHUB_REF_NAME#v}
          make package-provider-jev GOARCH=amd64 VERSION=${GITHUB_REF_NAME#v}

      - name: Package arm64
        run: |
          make package-deb GOARCH=arm64 VERSION=${GITHUB_REF_NAME#v}
          make package-provider-jev GOARCH=arm64 VERSION=${GITHUB_REF_NAME#v}

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb pinproc_linux_* pinproc-provider-jev_linux_* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/pinproc_linux_* dist/pinproc-provider-jev_linux_* dist/checksums.txt --title "${GITHUB_REF_NAME}" --generate-notes
