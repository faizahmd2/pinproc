name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Building ${GITHUB_REF_NAME} from ${GITHUB_SHA}"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release
        run: make release VERSION=${GITHUB_REF_NAME}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pinproc_linux_amd64 \
            dist/pinproc_linux_arm64 \
            dist/app.yaml \
            dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "Read-only Linux machine diagnostics using bounded system evidence and AI-assisted analysis."