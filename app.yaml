# pinproc configuration.
# The agent is local-only: it reads /proc, /sys, cgroups and related kernel state.
# Jev is the V2 structured decision provider; rules remain the deterministic fallback.

app:
  name: pinproc
  log_level: info

server:
  listen: 127.0.0.1:8080

service:
  user: ""
  group: ""
  data_directory: /var/lib/pinproc

engine:
  budget: normal
  sample_window: 1s
  parallel_width: 3

decision:
  provider: jev
  api_key: "<replace-with-ai-key>"
  base_url: https://api.typesafe.ai
  model: jev-latest
  timeout: 10s

narrator:
  enabled: true

source:
  read_timeout: 2s

report:
  max_findings: 5

output:
  directory: /var/lib/pinproc/reports
