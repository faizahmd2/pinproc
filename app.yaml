# pinproc V2 configuration.
# The service is Linux-only and reads the local OS directly.
# End users normally only need the AI key and optional callback.

app:
  name: pinproc
  log_level: info

server:
  listen: 127.0.0.1:8080
  api_key: ""

service:
  user: pinproc
  group: pinproc
  data_directory: /var/lib/pinproc

decision:
  provider: jev
  api_key: "<replace-with-ai-key>"
  base_url: https://api.typesafe.ai
  model: jev-latest
  timeout: 10s

narrator:
  enabled: true

source:
  read_timeout: 2s

report:
  max_findings: 5

callback:
  enabled: false
  url: ""
  timeout: 5s
