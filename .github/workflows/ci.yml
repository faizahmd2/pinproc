name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Verify read-only posture (no HTTP server / transport in the binary)
        run: |
          ! go list -deps ./cmd/diagnos | grep -q "net/http/.*server"
          ! strings pinproc | grep -q "ListenAndServe"

      - name: Build release artifacts
        run: make release VERSION=0.0.0

      - name: Build Debian package
        run: |
          make package-deb GOARCH=amd64 VERSION=0.0.0
          ls -lh dist/*.deb

      - name: Smoke install and purge
        run: |
          set -x
          CORE=./dist/pinproc_0.0.0_amd64.deb
          set +e
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y "$CORE"
          install_rc=$?
          set -e
          if [ "$install_rc" -ne 0 ]; then
            echo "apt-get returned $install_rc; verify dpkg completed the package installation cleanly"
            sudo dpkg --audit
            test "$(dpkg-query -W -f='\${Status}' pinproc)" = "install ok installed"
          fi
          test -x /usr/bin/pinproc
          test -f /usr/lib/systemd/system/pinproc.service
          sudo test -f /etc/pinproc/config.yaml
          sudo test -d /var/lib/pinproc
          getent passwd pinproc
          getent group pinproc
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get remove -y pinproc
          sudo test -f /etc/pinproc/config.yaml
          test -d /var/lib/pinproc
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y "$CORE"
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get purge -y pinproc
          test ! -e /usr/bin/pinproc
          test ! -e /usr/lib/systemd/system/pinproc.service
          test ! -e /etc/pinproc
          test ! -e /var/lib/pinproc
          ! getent passwd pinproc
          ! getent group pinproc
