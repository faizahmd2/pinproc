# vm-native-diagnos configuration.
# The agent is local-only: it reads /proc, /sys, cgroups and related kernel state.
# Jev is the V2 structured decision provider; rules remain the deterministic fallback.

app:
  name: vm-native-diagnos
  log_level: info

server:
  listen: 127.0.0.1:8080

engine:
  budget: normal
  sample_window: 1s
  parallel_width: 3

decision:
  provider: jev
  base_url: https://api.typesafe.ai
  model: jev-latest
  timeout: 10s

narrator:
  enabled: true

output:
  directory: ~/diagnos/reports
