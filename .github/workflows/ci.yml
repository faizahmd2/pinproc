name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Verify core has no vendor provider dependency
        run: |
          ! go list -deps ./cmd/diagnos | grep -q "/internal/decision/jev"
          ! strings pinproc | grep -q "api.typesafe.ai"
          ! strings pinproc | grep -q "/v1/systemone"

      - name: Build provider
        run: make build-provider

      - name: Build release artifacts
        run: make release VERSION=0.0.0

      - name: Build Debian packages
        run: |
          make package-deb GOARCH=amd64 VERSION=0.0.0
          make package-provider-jev GOARCH=amd64 VERSION=0.0.0
          ls -lh dist/*.deb

      - name: Smoke install and purge
        run: |
          # CI diagnostic: show the exact smoke assertion that fails.
          set -x
          CORE=./dist/pinproc_0.0.0_amd64.deb
          PROVIDER=./dist/pinproc-provider-jev_0.0.0_amd64.deb
          set +e
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y "$CORE" "$PROVIDER"
          install_rc=$?
          set -e
          if [ "$install_rc" -ne 0 ]; then
            echo "apt-get returned $install_rc; verify dpkg completed the package installation cleanly"
            sudo dpkg --audit
            test "$(dpkg-query -W -f='\${Status}' pinproc)" = "install ok installed"
            test "$(dpkg-query -W -f='\${Status}' pinproc-provider-jev)" = "install ok installed"
          fi
          test -x /usr/bin/pinproc
          test -x /usr/libexec/pinproc/providers/jev
          test -f /usr/lib/systemd/system/pinproc.service
          test -f /usr/share/pinproc/providers/jev.yaml
          sudo ls -la /etc/pinproc || true
          sudo stat /etc/pinproc/config.yaml || true
          sudo journalctl -u pinproc --no-pager -n 20 || true
          test -f /etc/pinproc/config.yaml
          test -d /var/lib/pinproc
          getent passwd pinproc
          getent group pinproc
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get remove -y pinproc-provider-jev
          test -x /usr/bin/pinproc
          test ! -e /usr/libexec/pinproc/providers/jev
          test ! -e /usr/share/pinproc/providers/jev.yaml
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get remove -y pinproc
          test -f /etc/pinproc/config.yaml
          test -d /var/lib/pinproc
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y "$CORE"
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get purge -y pinproc
          test ! -e /usr/bin/pinproc
          test ! -e /usr/lib/systemd/system/pinproc.service
          test ! -e /etc/pinproc
          test ! -e /var/lib/pinproc
          test ! -e /usr/libexec/pinproc
          test ! -e /usr/share/pinproc
          ! getent passwd pinproc
          ! getent group pinproc