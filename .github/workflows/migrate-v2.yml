name: migrate-v2
on:
  push:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout empty destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import V2 source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git clone --depth 1 --branch v2-investigation-engine https://github.com/faizahmd2/diagnos.git /tmp/diagnos-v2
          rsync -a --exclude '.git' /tmp/diagnos-v2/ ./
          rm -f .github/workflows/migrate-v2.yml
      - name: Commit imported V2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate V2 into vm-native-diagnos"
          git push origin HEAD:master
