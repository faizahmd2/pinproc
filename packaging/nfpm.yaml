name: pinproc
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: Faiz Ahmad
description: Read-only Linux machine investigator
homepage: https://github.com/faizahmd2/pinproc
license: MIT

contents:
  - src: ${NFPM_BINARY}
    dst: /usr/bin/pinproc
    file_info:
      mode: 0755

  - src: packaging/pinproc.service
    dst: /usr/lib/systemd/system/pinproc.service
    file_info:
      mode: 0644

  - src: packaging/pinproc.sysusers
    dst: /usr/lib/sysusers.d/pinproc.conf
    file_info:
      mode: 0644

  - src: packaging/config.yaml
    dst: /etc/pinproc/config.yaml
    type: config
    file_info:
      mode: 0640

  - dst: /usr/libexec/pinproc/providers
    type: dir
    file_info:
      mode: 0755

  - dst: /usr/share/pinproc/providers
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh

overrides:
  deb:
    depends:
      - systemd
